:root{
  --bg:#1a1230; --panel:#1e2a3d; --panel2:#16202f; --edge:#3d5875; --ink:#26324a;
  --blue:#2f7fd1; --blue-d:#1b4f8c; --red:#e5484d; --red-d:#9c2b31; --orange:#ff9f1a; --orange-d:#b86b05; --green:#3fb57c; --green-d:#23724d;
  --gold:#ffd166; --text:#f3f0ff; --muted:#9fb3cc;
  --hearts:#ff4b5c; --diamonds:#ff9f1a; --spades:#26324a; --clubs:#1d7fbf;
  --pix:'Pix',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;height:100%;color:var(--text);font-family:var(--pix);touch-action:manipulation;overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:-2}
#crt{position:fixed;inset:0;pointer-events:none;z-index:50;
  background:
    radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%),
    repeating-linear-gradient(to bottom,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply}
body.nocrt #crt{display:none}
#app{position:relative;min-height:100%;max-width:560px;margin:0 auto;padding:10px 10px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}

/* ---------- buttons ---------- */
button{font:inherit;font-weight:400;font-size:21px;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;border:0;border-radius:10px;padding:11px 16px;color:#fff;
  background:var(--blue);box-shadow:0 5px 0 var(--blue-d),0 7px 8px rgba(0,0,0,.35);text-shadow:0 2px 0 rgba(0,0,0,.35);
  transition:transform .08s,box-shadow .08s,filter .15s;position:relative;top:0}
button:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-2px) rotate(-.6deg)}
button:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--blue-d)}
button.red{background:var(--red);box-shadow:0 5px 0 var(--red-d),0 7px 8px rgba(0,0,0,.35)}
button.red:active:not(:disabled){box-shadow:0 1px 0 var(--red-d)}
button.orange{background:var(--orange);box-shadow:0 5px 0 var(--orange-d),0 7px 8px rgba(0,0,0,.35)}
button.orange:active:not(:disabled){box-shadow:0 1px 0 var(--orange-d)}
button.green{background:var(--green);box-shadow:0 5px 0 var(--green-d),0 7px 8px rgba(0,0,0,.35)}
button.green:active:not(:disabled){box-shadow:0 1px 0 var(--green-d)}
button.ghost{background:#33445c;box-shadow:0 4px 0 #1d2a3b,0 6px 8px rgba(0,0,0,.3);color:#dbe7f7;font-size:19px}
button.ghost:active:not(:disabled){box-shadow:0 1px 0 #1d2a3b}
button.small{padding:5px 10px;font-size:16px;border-radius:8px;box-shadow:0 3px 0 var(--blue-d)}
button.ghost.small{box-shadow:0 3px 0 #1d2a3b}
button:disabled{filter:grayscale(.85) brightness(.7);cursor:default;transform:none;box-shadow:0 3px 0 rgba(0,0,0,.4)}
input,select{font:inherit;font-size:22px;border-radius:10px;border:3px solid var(--edge);background:var(--panel2);color:var(--text);padding:10px 12px;width:100%;outline:0}
input:focus,select:focus{border-color:var(--gold)}
input::placeholder{color:#5f7690}
h1,h2,h3{margin:0;font-weight:700}
.center{text-align:center}
.muted{color:var(--muted)}
.panel{background:var(--panel);border:3px solid var(--edge);border-radius:14px;padding:14px;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}
.stack{display:flex;flex-direction:column;gap:12px}

/* ---------- home + lobby ---------- */
.home{margin-top:3vh}
.logo{text-align:center;font-size:60px;line-height:1;letter-spacing:2px;text-shadow:0 4px 0 #000a;margin:6px 0 2px}
.logo span{display:inline-block;animation:wave 2.2s ease-in-out infinite;animation-delay:calc(var(--i) * -.18s)}
.logo span:nth-child(odd){color:var(--gold)}
@keyframes wave{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}
.tagline{text-align:center;color:var(--muted);letter-spacing:3px;font-size:17px;text-transform:uppercase}
.fan{display:flex;justify-content:center;height:128px;margin:8px 0 0;position:relative}
.fan .card{margin-left:-20px;transform:rotate(var(--rot)) translateY(var(--ty))}
.fan .card:first-child{margin-left:0}
.code{font-size:78px;letter-spacing:14px;text-align:center;color:var(--gold);padding-left:14px;text-shadow:0 5px 0 #000a;animation:wave 2.4s ease-in-out infinite}
.codeinput{text-transform:uppercase;letter-spacing:10px;text-align:center;font-size:32px}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plist li{display:flex;align-items:center;gap:8px;background:var(--panel2);border:2px solid var(--edge);border-radius:10px;padding:8px 12px}
.tag{font-size:15px;text-transform:uppercase;letter-spacing:1px;color:#1a1230;background:var(--gold);border-radius:6px;padding:1px 7px}

/* ---------- top bar + players ---------- */
.bar{display:flex;align-items:center;gap:8px;font-size:18px}
.bar .chip{background:var(--panel);border:2px solid var(--edge);border-radius:10px;padding:4px 10px;color:var(--text)}
.players{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 6px}
.pchip{position:relative;flex:1 0 auto;min-width:100px;background:var(--panel);border:3px solid var(--edge);border-radius:12px;padding:6px 10px;font-size:19px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.pchip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.pchip .sub{color:var(--muted);font-size:16px;display:flex;gap:8px}
.pchip .sub b{color:var(--gold);font-weight:700}
.pchip.turn{border-color:var(--gold);background:#2b3550;animation:chipglow 1.2s ease-in-out infinite}
.pchip.turn::before{content:'▼';position:absolute;top:-17px;left:50%;margin-left:-8px;color:var(--gold);font-size:16px;animation:arrow .7s ease-in-out infinite;text-shadow:0 2px 0 #000a}
@keyframes arrow{50%{transform:translateY(5px)}}
@keyframes chipglow{50%{box-shadow:0 4px 0 rgba(0,0,0,.35),0 0 18px rgba(255,209,102,.55)}}
.pchip.off{opacity:.55}

/* ---------- table ---------- */
.table{background:rgba(10,12,28,.55);border:3px solid var(--edge);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:12px;min-height:200px;box-shadow:inset 0 0 30px rgba(0,0,0,.45)}
.piles{display:flex;gap:26px;justify-content:center;align-items:flex-end}
.pile{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:17px;color:var(--muted)}
.pile .stackwrap{position:relative}
.pile .back,.pile .card .face,.pile .empty{box-shadow:2px 2px 0 #0007,4px 4px 0 #0005,6px 6px 0 #0003}
.pile.can .stackwrap{animation:bobpile 1s ease-in-out infinite;cursor:pointer}
.pile.can .back,.pile.can .face{outline:4px solid var(--gold);outline-offset:2px;border-radius:9px}
@keyframes bobpile{50%{transform:translateY(-6px)}}
.melds{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.meld{background:rgba(255,255,255,.07);border:3px solid #ffffff22;border-radius:12px;padding:4px 8px 8px}
.meld .lbl{font-size:16px;color:var(--muted);margin:0 0 4px 2px;white-space:nowrap}
.meld .cards{display:flex}
.meld .cards .card{margin-left:-14px}
.meld .cards .card:first-child{margin-left:0}
.meld.target{border-color:var(--gold);background:rgba(255,209,102,.2);cursor:pointer;animation:wiggle .5s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg) scale(1.03)}}

/* ---------- cards ---------- */
.card{position:relative;width:58px;height:82px;flex:0 0 auto;transform:rotate(var(--rot,0deg)) translateY(var(--ty,0px));transition:transform .18s cubic-bezier(.3,1.6,.5,1);user-select:none;-webkit-user-select:none;z-index:var(--z,1)}
.card .face{position:absolute;inset:0;background:#fdf6e3;border:3px solid #16111f;border-radius:9px;color:var(--c);
  box-shadow:0 4px 0 rgba(0,0,0,.45);overflow:hidden;transform:perspective(500px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .12s,box-shadow .12s}
.card.sm .face{border-width:2px;border-radius:7px;box-shadow:0 3px 0 rgba(0,0,0,.45)}
.card.H{--c:var(--hearts)}.card.D{--c:var(--diamonds)}.card.S{--c:var(--spades)}.card.C{--c:var(--clubs)}
.card .rk{position:absolute;top:1px;left:5px;font-size:27px;line-height:1}
.card .sp{position:absolute;top:25px;left:5px;width:13px;height:13px}
.card .bg{position:absolute;right:5px;bottom:5px;width:30px;height:30px}
.card .bg.letter{font-size:40px;line-height:30px;text-align:center;width:30px}
.card .rk2{position:absolute;right:5px;bottom:2px;font-size:15px;line-height:1;opacity:.55}
.card .face::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 48%,transparent 62%);background-size:260% 100%;background-position:var(--sheen,150%) 0;opacity:.7;pointer-events:none}
.card.sm{width:42px;height:60px}
.card.sm .rk{font-size:20px;top:1px;left:3px}
.card.sm .sp{top:16px;left:3px;width:11px;height:11px}
.card.sm .bg{width:21px;height:21px;right:3px;bottom:3px}
.card.sm .bg.letter{font-size:27px;line-height:21px;width:21px}
.card.sm .rk2{display:none}
.hand .card{cursor:pointer}
.hand .card .face{animation:bob 3.6s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -3px}}
.hand .card:hover{--z:30 !important}
.hand .card:hover .face{box-shadow:0 8px 0 rgba(0,0,0,.4),0 0 0 2px var(--gold)}
.card.sel{--ty:-26px !important;--z:25 !important}
.card.sel .face{box-shadow:0 10px 0 rgba(0,0,0,.4),0 0 0 3px var(--gold),0 0 22px rgba(255,209,102,.7);animation:jig .35s ease-in-out infinite}
@keyframes jig{0%,100%{rotate:-1.5deg}50%{rotate:1.5deg}}
.back{width:58px;height:82px;border-radius:9px;border:3px solid #16111f;background:
  radial-gradient(circle at 50% 50%,#ffd166 0 9px,transparent 10px),
  repeating-linear-gradient(45deg,#b3262d 0 7px,#8c1d28 7px 14px);box-shadow:0 4px 0 rgba(0,0,0,.45);position:relative;overflow:hidden}
.back::after{content:'';position:absolute;inset:4px;border:2px solid #ffd16688;border-radius:5px}
.empty{width:58px;height:82px;border-radius:9px;border:3px dashed #ffffff33}

/* ---------- banner, hand, actions ---------- */
.banner{text-align:center;font-size:24px;padding:8px 10px;border-radius:12px;background:var(--panel);border:3px solid var(--edge);text-shadow:0 2px 0 #0008;letter-spacing:.5px}
.banner.you{background:#4a2a12;border-color:var(--orange);color:var(--gold)}
.banner.pop{animation:bannerpop .6s cubic-bezier(.2,1.8,.4,1)}
@keyframes bannerpop{0%{transform:scale(.6) rotate(-4deg);opacity:0}100%{transform:none;opacity:1}}
.hand{display:flex;flex-wrap:nowrap;justify-content:center;padding:34px 4px 12px;min-height:150px;perspective:900px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.hint{text-align:center;font-size:18px;color:#c9d8ee;min-height:22px;text-shadow:0 2px 0 #000c}
.log{font-size:16px;color:#b5c6de;text-align:center;min-height:18px;text-shadow:0 2px 0 #000c}
.log div:last-child{color:var(--text)}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,6,20,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60;animation:fadein .4s both}
.overlay.late{animation-delay:1.1s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border:4px solid var(--gold);border-radius:16px;padding:16px;max-width:540px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 8px 0 rgba(0,0,0,.5);animation:modalin .5s cubic-bezier(.2,1.5,.4,1) both}
.overlay.late .modal{animation-delay:1.1s}
@keyframes modalin{from{transform:scale(.6) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}
.modal h2{color:var(--gold);font-size:34px;text-shadow:0 3px 0 #000a}
.modal ul{padding-left:18px;margin:8px 0;line-height:1.35;font-size:20px}
table{width:100%;border-collapse:collapse;font-size:20px}
th{color:var(--muted);font-weight:400;font-size:16px}
th,td{text-align:left;padding:6px 4px;border-bottom:2px solid #ffffff18;vertical-align:middle}
td .cards{display:flex;flex-wrap:wrap;gap:3px}
td b{color:var(--gold);font-size:26px;font-weight:400}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--red);border:3px solid #16111f;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;max-width:90vw;text-align:center;box-shadow:0 5px 0 var(--red-d)}
#toast.show{opacity:1;transform:translateX(-50%)}
.conn{background:var(--orange);color:#2b1700;text-align:center;border-radius:10px;padding:6px;font-size:18px;border:3px solid #16111f}
.popup{position:fixed;z-index:70;pointer-events:none;font-size:34px;white-space:nowrap;padding:2px 10px;border-radius:8px;border:3px solid #16111f;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.4);box-shadow:0 4px 0 rgba(0,0,0,.45);transform:translate(-50%,-50%)}
.popup.blue{background:var(--blue)}.popup.red{background:var(--red)}.popup.gold{background:var(--orange);color:#2b1700;text-shadow:none}
.ghostcard{position:fixed;z-index:65;pointer-events:none;margin:0}
#fxcanvas{position:fixed;inset:0;pointer-events:none;z-index:75}
.bigtext{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:76;pointer-events:none;font-size:96px;color:var(--gold);text-shadow:0 6px 0 #000b,0 0 30px rgba(255,209,102,.8);white-space:nowrap}

@media (max-width:430px){
  .card{width:50px;height:72px}.card .rk{font-size:24px}.card .sp{top:22px;width:11px;height:11px}.card .bg{width:26px;height:26px}.card .bg.letter{font-size:34px;line-height:26px;width:26px}
  .back,.empty{width:50px;height:72px}
  .card.sm{width:40px;height:58px}.card.sm .rk{font-size:19px}.card.sm .sp{top:16px}
  .code{font-size:62px}.logo{font-size:48px}
  .bigtext{font-size:68px}
  button{font-size:19px}
  .pchip{font-size:18px}
}
@media (prefers-reduced-motion:reduce){
  .hand .card .face,.logo span,.code,.pile.can .stackwrap,.pchip.turn,.pchip.turn::before,.meld.target{animation:none}
}

/* =====================================================
   OKIE RUMMY: round table, builder, buy pause, jokers
   ===================================================== */
.narrow{max-width:520px;margin-inline:auto;width:100%}
.contract{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:3px solid var(--gold);border-radius:12px;padding:5px 12px;font-size:19px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.contract .rd{background:var(--gold);color:#1a1230;border-radius:7px;padding:0 8px;font-size:17px}
.contract b{color:var(--gold);font-weight:400}
.gamewrap{gap:8px}
.gamegrid{display:flex;flex-direction:column;gap:10px}
.main{display:flex;flex-direction:column;gap:8px;min-width:0}
.side{display:flex;flex-direction:column;gap:8px;min-width:0}

/* the table */
.ring{position:relative;width:100%;aspect-ratio:1/1.02;max-height:420px;margin:0 auto}
.ring .felt{position:absolute;inset:11% 3% 11% 3%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 42%,#1f7a4f 0,#14553a 55%,#0d3a29 100%);
  border:6px solid #5a3a1b;box-shadow:0 0 0 4px #2a1a0a,inset 0 0 40px rgba(0,0,0,.55),0 10px 0 rgba(0,0,0,.35)}
.ring .felt::after{content:'';position:absolute;inset:7%;border-radius:50%;border:2px dashed rgba(255,255,255,.14)}
.center-pile{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:3}
.center-pile .piles{gap:18px}
.center-pile .pile{font-size:14px;color:#cfe6d9;gap:5px}
.buybtn{font-size:18px;padding:5px 12px;white-space:nowrap}
.buybtn.hot{animation:buypulse .7s ease-in-out infinite}
@keyframes buypulse{50%{transform:scale(1.08)}}
.pile.wait .stackwrap{opacity:.55;filter:saturate(.6)}

/* seats */
.seat{position:absolute;transform:translate(-50%,-50%);z-index:4;min-width:78px;max-width:104px;text-align:center;background:var(--panel);border:3px solid var(--edge);border-radius:12px;padding:3px 6px 4px;box-shadow:0 4px 0 rgba(0,0,0,.4);font-size:16px;line-height:1.05}
.seat .sname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .sfan{position:relative;height:22px;margin:2px auto 1px;width:60px}
.seat .sfan i{position:absolute;top:2px;left:calc(var(--j) * (36px / max(var(--m),1)));width:16px;height:21px;border-radius:3px;border:2px solid #16111f;
  background:repeating-linear-gradient(45deg,#b3262d 0 3px,#8c1d28 3px 6px);transform:rotate(calc((var(--j) - var(--m) / 2) * 7deg))}
.seat .scount{position:absolute;right:-2px;top:-1px;background:var(--gold);color:#1a1230;border-radius:7px;padding:0 5px;font-size:15px;font-weight:400;z-index:2}
.seat .sinfo{display:flex;gap:5px;justify-content:center;align-items:center;color:var(--muted);font-size:15px}
.seat .sinfo b{color:var(--gold);font-weight:400}
.dn{background:var(--green);color:#052a1a;border-radius:5px;padding:0 5px;font-size:13px;letter-spacing:.5px}
.seat .sbuys{display:flex;gap:3px;justify-content:center;align-items:center;height:11px;margin-top:2px}
.seat .sbuys u{width:8px;height:8px;border-radius:50%;border:2px solid var(--orange);display:inline-block;text-decoration:none}
.seat .sbuys u.on{background:var(--orange)}
.seat .cpu{font-size:12px;color:var(--muted);margin-left:3px;text-transform:uppercase}
.seat.me{border-color:#6cb4ff}
.seat.down{border-color:var(--green)}
.seat.turn{border-color:var(--gold);background:#2b3550;animation:chipglow 1.2s ease-in-out infinite;z-index:5}
.seat.turn::before{content:'▼';position:absolute;top:-17px;left:50%;margin-left:-8px;color:var(--gold);font-size:16px;animation:arrow .7s ease-in-out infinite;text-shadow:0 2px 0 #000a}
.seat.buying{border-color:var(--orange);animation:buypulse .7s ease-in-out infinite}
.seat.off{opacity:.55}

/* sets on the table */
.meldpanel{padding:10px;max-height:none}
.meldpanel h3{font-size:22px;color:var(--gold);margin-bottom:6px}
.ogroup{margin-bottom:8px}
.ogroup .oname{font-size:17px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-bottom:3px}
.ogroup .none{font-size:14px;color:#6e84a1;padding-left:4px}
.ogroup .melds{justify-content:flex-start;gap:8px}
.meld{position:relative}
.meld .ends{display:none;position:absolute;left:0;right:0;bottom:-14px;justify-content:center;gap:6px;z-index:6}
.meld.target.pick .ends{display:flex}
.meld.pick{margin-bottom:12px}
.meld.target{animation:wiggle .5s ease-in-out infinite}
.meld .cards .card{margin-left:-16px}
.meld .cards .card:first-child{margin-left:0}

/* jokers + used cards */
.card.J{--c:#9b4dff}
.card.J .face{background:linear-gradient(135deg,#fdf6e3 0,#f3e8ff 55%,#ffe9f3 100%)}
.card .jw{position:absolute;left:0;right:0;top:34px;text-align:center;font-size:13px;letter-spacing:1px;color:var(--c)}
.card .bg.star{font-size:34px;line-height:30px;text-align:center;width:30px;left:50%;margin-left:-15px;right:auto;bottom:4px;animation:spinstar 4s linear infinite}
@keyframes spinstar{0%,100%{transform:rotate(-10deg) scale(1)}50%{transform:rotate(10deg) scale(1.15)}}
.card .as{position:absolute;left:0;right:0;bottom:0;text-align:center;background:#9b4dff;color:#fff;font-size:12px;line-height:14px}
.card.sm .jw{display:none}
.card.sm .bg.star{font-size:20px;line-height:20px;width:20px;margin-left:-10px;bottom:10px}
.card.sm .as{font-size:11px;line-height:12px}
.card.used .face{opacity:.35;filter:grayscale(.6)}
.card.used{--ty:10px !important}

/* go-down builder */
.builder{padding:10px;display:flex;flex-direction:column;gap:8px}
.btitle{font-size:22px;color:var(--gold);text-align:center}
.slot{border:3px dashed #ffffff40;border-radius:12px;padding:5px 8px 6px;background:rgba(255,255,255,.05);cursor:pointer;min-height:84px}
.slot.active{border-color:var(--gold);background:rgba(255,209,102,.12)}
.slot.ok{border-style:solid;border-color:var(--green);background:rgba(63,181,124,.15)}
.slot .slbl{font-size:16px;color:var(--muted);margin-bottom:3px}
.slot .slbl b{color:var(--green);font-weight:400}
.slot .cards{display:flex;flex-wrap:nowrap;overflow-x:auto;padding:3px 2px;min-height:62px;align-items:center}
.slot .cards .card{margin-left:-8px;cursor:pointer}
.slot .cards .card:first-child{margin-left:0}
.slot .ph{color:#6e84a1;font-size:16px}

/* buy pause */
.buyov{background:rgba(8,6,20,.55)}
.buyov.static,.buyov.static .modal{animation:none}
.buyov .modal{border-color:var(--orange);max-width:420px}
.buyov h2{color:var(--orange)}
.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;text-align:left}
.qlist li{display:flex;gap:8px;align-items:center;background:var(--panel2);border:2px solid var(--edge);border-radius:10px;padding:6px 10px;font-size:19px}
.okc{color:var(--green);font-weight:400}.wantc{color:var(--orange);font-weight:400}
.handwrap{min-width:0}

/* ---------- desktop ---------- */
@media (min-width:900px){
  #app{max-width:1240px;padding:14px 22px 20px}
  .gamegrid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
  .ring{aspect-ratio:auto;height:clamp(330px,calc(var(--vh,1vh)*52),520px);max-height:none}
  .ring .felt{inset:10% 2% 10% 2%}
  .seat{min-width:116px;max-width:150px;font-size:19px;padding:5px 10px 6px}

<script>
/* Visual and audio effects: swirling pixel background, sounds, popups, confetti, screen shake.
   Everything here is optional; the game still works if any of it is unavailable. */
(function () {
  'use strict';
  const reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const FX = {};

  /* ---------- swirling background (low-res canvas, scaled up, so it looks like pixel paint) ---------- */
  FX.background = function (canvas) {
    let ctx = null;
    try { ctx = canvas.getContext('2d'); } catch (e) { /* no canvas */ }
    if (!ctx) return { setMood: function () {} };
    const H = 72;
    let W = 96, img = null, d = null;
    const DARK = [22, 12, 40], RED = [206, 48, 66], BLUE = [38, 104, 190], DEEP = [70, 24, 84];
    let t = 0, last = 0, mood = 0.5, moodTarget = 0.5;
    function size() {
      const aspect = Math.max(0.4, Math.min(2.5, (window.innerWidth || 400) / (window.innerHeight || 800)));
      W = Math.round(H * aspect); canvas.width = W; canvas.height = H;
      img = ctx.createImageData(W, H); d = img.data;
    }
    function draw() {
      mood += (moodTarget - mood) * 0.04;
      const t1 = 0.30, t2 = 0.52 + 0.2 * (1 - mood), t3 = 0.80;   // my turn: more red; waiting: more blue
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const ux = (x - W / 2) / H * 2.2, uy = (y - H / 2) / H * 2.2;
          const len = Math.sqrt(ux * ux + uy * uy);
          const ang = Math.atan2(uy, ux) + t * 0.3 - len * 2.6;
          let px = len * Math.cos(ang), py = len * Math.sin(ang);
          for (let i = 0; i < 4; i++) {
            px += 0.7 * Math.sin(py * 1.9 + t * 0.55 + i * 1.7);
            py += 0.7 * Math.cos(px * 1.7 - t * 0.45 + i * 1.1);
          }
          let v = (Math.sin(px * 2.3 + py * 1.5) + Math.sin(py * 1.8 - px * 0.9 + t * 0.2)) * 0.25 + 0.5;
          v = Math.floor(v * 8) / 8;                         // posterize: the paint-band look
          let c;
          if (v < t1) c = DARK; else if (v < t2) c = BLUE; else if (v < t3) c = RED; else c = DEEP;
          const o = (y * W + x) * 4, k = 0.62;
          d[o] = c[0] * k; d[o + 1] = c[1] * k; d[o + 2] = c[2] * k; d[o + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
    }
    function frame(ts) {
      requestAnimationFrame(frame);
      if (document.hidden || ts - last < 40) return;       // about 25 frames a second
      last = ts; t += 0.01; draw();     // slow drift
    }
    size(); draw();
    window.addEventListener('resize', function () { size(); draw(); });
    if (!reduced) requestAnimationFrame(frame);
    return { setMood: function (m) { moodTarget = m; } };
  };

  /* ---------- sound (tiny synth, no audio files) ---------- */
  const Sound = { ctx: null, on: true };
  try { Sound.on = localStorage.getItem('rummy.sound') !== 'off'; } catch (e) { /* ignore */ }
  Sound.unlock = function () {
    if (Sound.ctx) { if (Sound.ctx.state === 'suspended') Sound.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { Sound.ctx = new AC(); } catch (e) { /* ignore */ }
  };
  Sound.toggle = function () {
    Sound.on = !Sound.on;
    try { localStorage.setItem('rummy.sound', Sound.on ? 'on' : 'off'); } catch (e) { /* ignore */ }
    if (Sound.on) Sound.unlock();
    return Sound.on;
  };
  function tone(freq, dur, type, vol, slideTo, delay) {
    const c = Sound.ctx; if (!c || !Sound.on) return;
    const t0 = c.currentTime + (delay || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.08, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function noise(dur, vol, freq, delay) {
    const c = Sound.ctx; if (!c || !Sound.on) return;
    const t0 = c.currentTime + (delay || 0), n = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, n, c.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq || 1800; g.gain.value = vol || 0.12;
    s.connect(f); f.connect(g); g.connect(c.destination); s.start(t0);
  }
  Sound.flip = function () { noise(0.09, 0.14, 2400); tone(220, 0.06, 'triangle', 0.05, 120); };
  Sound.select = function (k) { tone(380 * Math.pow(2, (k || 0) / 12), 0.07, 'square', 0.05); };
  Sound.deselect = function () { tone(260, 0.05, 'square', 0.04, 200); };
  Sound.discard = function () { noise(0.12, 0.2, 700); tone(110, 0.12, 'triangle', 0.12, 60); };
  Sound.meld = function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.16, 'square', 0.06, 0, i * 0.06); }); };
  Sound.layoff = function () { tone(660, 0.08, 'square', 0.06); tone(880, 0.12, 'square', 0.06, 0, 0.07); };
  Sound.turn = function () { tone(880, 0.1, 'triangle', 0.09); tone(1175, 0.18, 'triangle', 0.09, 0, 0.1); };
  Sound.win = function () { [523, 659, 784, 659, 784, 1047, 1319].forEach(function (f, i) { tone(f, 0.22, 'square', 0.07, 0, i * 0.1); }); };
  Sound.lose = function () { tone(330, 0.25, 'triangle', 0.1, 220); tone(247, 0.4, 'triangle', 0.1, 150, 0.2); };
  Sound.click = function () { tone(520, 0.05, 'square', 0.05, 700); tone(780, 0.06, 'square', 0.04, 0, 0.04); };
  Sound.hover = function () { tone(1200, 0.025, 'triangle', 0.025, 1400); };
  Sound.key = function () { tone(220 + Math.random() * 60, 0.04, 'triangle', 0.06, 150); };
  Sound.chat = function () { tone(660, 0.06, 'sine', 0.06, 0); tone(880, 0.09, 'sine', 0.05, 0, 0.07); };
  Sound.alarm = function () { [0, 0.16, 0.32].forEach(function (d) { tone(760, 0.12, 'square', 0.07, 520, d); tone(520, 0.12, 'square', 0.05, 380, d + 0.07); }); };
  Sound.error = function () { tone(150, 0.18, 'sawtooth', 0.07, 90); };
  FX.Sound = Sound;

  /* ---------- popups, shake, confetti ---------- */
  FX.popup = function (text, color, rect) {
    if (!document.body.animate) return;
    const el = document.createElement('div');
    el.className = 'popup ' + (color || 'blue'); el.textContent = text;
    el.style.left = (rect.left + rect.width / 2) + 'px'; el.style.top = (rect.top + rect.height / 2) + 'px';
    document.body.append(el);
    const a = el.animate([
      { transform: 'translate(-50%,-50%) scale(.3) rotate(-8deg)', opacity: 0 },
      { transform: 'translate(-50%,-90%) scale(1.25) rotate(3deg)', opacity: 1, offset: 0.25 },
      { transform: 'translate(-50%,-110%) scale(1) rotate(0)', opacity: 1, offset: 0.7 },
      { transform: 'translate(-50%,-170%) scale(.9)', opacity: 0 }
    ], { duration: 1100, easing: 'ease-out' });
    a.onfinish = function () { el.remove(); };
  };
  FX.shake = function (el, px) {
    if (reduced || !el.animate) return;
    px = px || 6;
    el.animate([
      { transform: 'translate(0,0)' }, { transform: 'translate(' + px + 'px,' + (-px / 2) + 'px) rotate(.4deg)' },
      { transform: 'translate(' + (-px) + 'px,' + px / 2 + 'px) rotate(-.4deg)' }, { transform: 'translate(' + px / 2 + 'px,' + px / 2 + 'px)' },
      { transform: 'translate(0,0)' }
    ], { duration: 380, easing: 'ease-out' });
  };
  FX.bigText = function (text) {
    if (!document.body.animate) return;
    const el = document.createElement('div'); el.className = 'bigtext'; el.textContent = text;
    document.body.append(el);
    const a = el.animate([
      { transform: 'translate(-50%,-50%) scale(.2) rotate(-12deg)', opacity: 0 },
      { transform: 'translate(-50%,-50%) scale(1.3) rotate(4deg)', opacity: 1, offset: 0.25 },
      { transform: 'translate(-50%,-50%) scale(1) rotate(0)', opacity: 1, offset: 0.75 },
      { transform: 'translate(-50%,-60%) scale(1.1)', opacity: 0 }
    ], { duration: 1400 });
    a.onfinish = function () { el.remove(); };
  };
  FX.confetti = function () {
    if (reduced) return;
    let cv;
    try { cv = document.createElement('canvas'); cv.id = 'fxcanvas'; cv.width = innerWidth; cv.height = innerHeight; document.body.append(cv); } catch (e) { return; }
    const ctx = cv.getContext && cv.getContext('2d'); if (!ctx) { cv.remove(); return; }
    const colors = ['#ff4b5c', '#ff9f1a', '#ffd166', '#2f7fd1', '#3fb57c', '#f3f0ff'];
    const ps = [];
    for (let i = 0; i < 90; i++) ps.push({
      x: innerWidth / 2 + (Math.random() - 0.5) * 120, y: innerHeight * 0.45,
      vx: (Math.random() - 0.5) * 16, vy: -Math.random() * 15 - 4, s: 5 + Math.random() * 7,
      c: colors[i % colors.length], life: 1
    });
    let n = 0;
    (function step() {
      ctx.clearRect(0, 0, cv.width, cv.height);
      ps.forEach(function (p) {
        p.vy += 0.5; p.x += p.vx; p.y += p.vy; p.vx *= 0.99;
        ctx.fillStyle = p.c; ctx.fillRect(Math.round(p.x / 4) * 4, Math.round(p.y / 4) * 4, p.s, p.s);
      });
      if (++n < 110) requestAnimationFrame(step); else cv.remove();
    })();
  };
  FX.countUp = function (el, to, delay) {
    const from = parseInt(el.dataset.from || '0', 10);
    if (reduced || from === to) { el.textContent = to; return; }
    el.textContent = from;
    setTimeout(function () {
      const t0 = performance.now(), dur = 900;
      (function step(now) {
        const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
        el.textContent = Math.round(from + (to - from) * e);
        if (k < 1) requestAnimationFrame(step);
      })(t0);
    }, delay || 0);
  };
  FX.reduced = reduced;
  window.FX = FX;
})();

</script>
<script>
/* Okie Rummy rules engine. Pure logic, no DOM, no network.
   Six rounds, each with a "contract" (books and runs) you must lay down before you can go out.
   Out-of-turn buying with a pause-and-approve flow. All house rules live in RULES. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();

})(typeof self !== 'undefined' ? self : this, function () {

  const RULES = {
    minPlayers: 3,
    maxPlayers: 8,
    handSize: 11,
    decksFor: function (n) { return n <= 3 ? 2 : (n <= 5 ? 3 : 4); },
    jokersPerDeck: 2,
    bookMin: 3,
    runMin: 4,
    // books / runs required to go down, one entry per round
    contracts: [{ b: 2, r: 0 }, { b: 0, r: 2 }, { b: 2, r: 1 }, { b: 1, r: 2 }, { b: 3, r: 0 }, { b: 0, r: 3 }],
    maxBuys: 3,            // per player, per round
    buyWindowMs: 3000,
  lookMs: 10000,
    dealMs: 4000,          // time for the shuffle-and-deal animation before the look-at-your-cards countdown     // after a discard, the stock is locked this long so others can press Buy
    maxReshuffles: Infinity,  // the discard pile is reshuffled whenever the stock runs out
    maxTurnsPerPlayer: Infinity  // no stalemates: a round only ends when someone goes out
  };

  function isJoker(c) { return c.s === 'J'; }
  function rankLabel(r) { return { 0: '★', 1: 'A', 11: 'J', 12: 'Q', 13: 'K', 14: 'A' }[r] || String(r); }
  function cardLabel(c) { return isJoker(c) ? 'Joker' : rankLabel(c.r) + SUIT_SYMBOL[c.s]; }
  function cardPoints(c) {
    if (isJoker(c)) return 25;
    if (c.r === 1) return 15;
    return c.r >= 8 ? 10 : 5;
  }
  function contractText(c) {
    const p = [];
    if (c.b) p.push(c.b + (c.b === 1 ? ' book' : ' books'));
    if (c.r) p.push(c.r + (c.r === 1 ? ' run' : ' runs'));
    return p.join(' + ');
  }

  function makeDeck(decks) {
    const out = [];
    for (let d = 0; d < decks; d++) {
      for (const s of SUITS) for (let r = 1; r <= 13; r++) out.push({ id: s + r + '-' + d, r: r, s: s });
      for (let j = 0; j < RULES.jokersPerDeck; j++) out.push({ id: 'JK' + j + '-' + d, r: 0, s: 'J' });
    }

  }

  /* Secure random numbers (the same kind used for encryption) where the browser has them. */
  function secureRand() {

  function checkBook(cards) {

  function layoutRun(cards) {

  /* Going down: check the groups, then add any other natural cards from the hand that fit them

  function planDown(hand, groups) {

  /* Which ways can `card` be added to `meld`? [] if none. For runs: 'low' and/or 'high'. For books: ['add']. */
  function layoffOptions(meld, card) {

  /* With exactly 2 cards in hand: can both be played on laid-down sets? Returns [{card, meldId, end}, ...] or null. */

  /* ---------- game state ---------- */

  function fail(msg) { return { ok: false, error: msg }; }

    rng = rng || Math.random;

      players: players.map(function (p) { return { id: p.id, name: p.name, bot: !!p.bot, hand: [], score: 0, down: false, buys: 0 }; }),

    st.players.forEach(function (p) { p.hand = deck.splice(0, RULES.handSize); p.down = false; p.buys = 0; });

    log(st, 'Round ' + st.round + ': ' + contractText(contractFor(st)) + '. ' + st.players[st.turn].name + ' goes first.');
  }

    if (st.status !== 'roundover') return fail('Round is still in progress');

  function isTopDead(st) { return st.discard.length > 0 && st.discard.length <= (st.deadBelow || 0); }
  function takeTop(st) {            // a normal pickup from the discard pile

  }

  function drawFromStock(st, rng) {
    if (!st.stock.length) {

  function canBuyNow(p) { return !p.down && p.buys < RULES.maxBuys; }

    if (idx === st.turn) return fail("It's your turn. Just take the card.");

    if (!st.discard.length) return fail('Nothing to buy');

  function doRespond(st, idx, choice, rng) {

      const g = mk(); g.style.opacity = '0'; g.style.zIndex = String(50 + idx);
      const delay = SH + idx * stagger;
      g.animate([
        { transform: 'translate(0,0) scale(.8) rotate(0deg)', opacity: 1 },
        { transform: 'translate(' + (tx - cx) + 'px,' + (ty - cy) + 'px) scale(.5) rotate(' + ((idx * 37) % 40 - 20) + 'deg)', opacity: 1, offset: 0.85 },
        { transform: 'translate(' + (tx - cx) + 'px,' + (ty - cy) + 'px) scale(.4) rotate(0deg)', opacity: 0 }

  /* Auto-play: on your turn, once you are down, cards that fit a laid-down set are played for you (never below 2 cards). */
  let autoTimer = null;
  function scheduleAuto() {
    clearTimeout(autoTimer);
    if (!autoLay || !V || V.status !== 'playing' || V.pending) return;
    const mi = meIdx(V), me = V.players[mi];
    if (!me || !me.down || V.turn !== mi || V.phase !== 'play' || V.hand.length <= 2 || frozenSecs() > 0 || building) return;
    let pick = null;
    for (let i = 0; i < V.hand.length && !pick; i++) {
      const c = V.hand[i]; if (E.isJoker(c)) continue;
      for (let j = 0; j < V.melds.length; j++) {
        const opts = E.layoffOptions(V.melds[j], c);
        if (opts.length) { pick = { type: 'layoff', id: c.id, meldId: V.melds[j].id, end: opts.indexOf('high') >= 0 ? 'high' : (opts.indexOf('low') >= 0 ? 'low' : undefined) }; break; }
      }
    }
    if (!pick) return;
    const key = V.round + ':' + V.turn + ':' + V.hand.map(function (c) { return c.id; }).join(',') + ':' + V.melds.length;
    if (key === autoKey) return;           // already tried this exact position
    autoKey = key;
    autoTimer = setTimeout(function () { if (autoLay) { Sound.layoff && Sound.layoff(); act(pick); } }, 450);
  }

     ===================================================== */
  const SUIT_ORDER = { S: 0, H: 1, C: 2, D: 3, J: 4 };
  function sortedHand(hand) {
    const byId = {}; hand.forEach(function (c) { byId[c.id] = c; });
    // current order: what you had, with new cards on the end
    const seen = {}; let cur = [];
    handOrder.forEach(function (id) { if (byId[id] && !seen[id]) { seen[id] = 1; cur.push(id); } });
    hand.forEach(function (c) { if (!seen[c.id]) { seen[c.id] = 1; cur.push(c.id); } });
    groups = groups.map(function (g) { return g.filter(function (id) { return byId[id]; }); }).filter(function (g) { return g.length >= 2; });
    const inGroup = {}; groups.forEach(function (g) { g.forEach(function (id) { inGroup[id] = true; }); });
    // sort the loose cards into the slots that saved groups don't occupy
    if (sortMode !== 'custom') {
      const loose = cur.filter(function (id) { return !inGroup[id]; }).map(function (id) { return byId[id]; });
      if (sortMode === 'rank') loose.sort(function (x, y) { return (x.s === 'J' ? 99 : x.r) - (y.s === 'J' ? 99 : y.r) || SUIT_ORDER[x.s] - SUIT_ORDER[y.s]; });
      else loose.sort(function (x, y) { return SUIT_ORDER[x.s] - SUIT_ORDER[y.s] || x.r - y.r; });
      let k = 0;
      cur = cur.map(function (id) { return inGroup[id] ? id : loose[k++].id; });
    }
    // keep each saved group side by side
    groups.forEach(function (g) {
      const first = cur.findIndex(function (id) { return g.indexOf(id) >= 0; });
      const members = cur.filter(function (id) { return g.indexOf(id) >= 0; });
      const rest = cur.filter(function (id) { return g.indexOf(id) < 0; });
      const before = cur.slice(0, first).filter(function (id) { return g.indexOf(id) < 0; }).length;
      rest.splice(before, 0, ...members);
      cur = rest;
    });
    handOrder = cur;
    return cur.map(function (id) { return byId[id]; });
  }

  /* If a seat (for example yours, once your laid-down sets show on it) sticks out over the status banner, push the banner down so its text stays readable. */
  function fixOverlap() {
    const app = document.getElementById('app'), z = parseFloat(app && app.style.zoom) || 1;
    const ring = document.querySelector('.ring'), contract = document.querySelector('.contract');
    if (ring && contract) {            // keep the top player's name and card count clear of the round banner
      ring.style.marginTop = '';
      const cb = contract.getBoundingClientRect();
      let top = Infinity;
      document.querySelectorAll('.seat').forEach(function (st) { top = Math.min(top, st.getBoundingClientRect().top); });
      const need = cb.bottom + 22 - top;     // 22px leaves room for the little turn arrow
      if (need > 0) ring.style.marginTop = Math.ceil(need / z) + 'px';
    }
    const banner = document.querySelector('.gamewrap .banner, .banner');
    if (!banner) return;
    banner.style.marginTop = '';
    const br = banner.getBoundingClientRect();
    let over = 0;
    document.querySelectorAll('.seat').forEach(function (st) {
      const r = st.getBoundingClientRect();
      if (r.bottom > br.top && r.top < br.bottom && r.right > br.left && r.left < br.right) over = Math.max(over, r.bottom - br.top);
    });
    if (over > 0) banner.style.marginTop = Math.ceil((over + 10) / z) + 'px';
  }

  /* =====================================================
     MOTION: cards fly between places, popups, shake, sound
     ===================================================== */
  function rectOf(el) { return el ? el.getBoundingClientRect() : null; }
  function captureRects() {
    const out = { cards: new Map(), stock: null, disc: null };
    const app = document.getElementById('app');
    if (!app) return out;
    app.querySelectorAll('.card[data-id]').forEach(function (el) {
      if (!out.cards.has(el.dataset.id)) out.cards.set(el.dataset.id, rectOf(el));
    });
    out.stock = rectOf(app.querySelector('.pile.stock .back, .pile.stock .empty'));
    out.disc = rectOf(app.querySelector('.pile.disc .card, .pile.disc .empty'));
    return out;
  }
  function chipRect(pid) { return rectOf(document.querySelector('.seat[data-pid="' + pid + '"]')); }

  function flyFrom(el, from, delay, spin, dur) {
    if (!el.animate || !from || FX.reduced) return;
    const to = el.getBoundingClientRect();
    if (!to.width) return;
    const dx = (from.left + from.width / 2) - (to.left + to.width / 2);
    const dy = (from.top + from.height / 2) - (to.top + to.height / 2);
    const sc = Math.max(0.3, Math.min(2.5, from.width / to.width));
    if (Math.abs(dx) < 2 && Math.abs(dy) < 2 && Math.abs(sc - 1) < 0.05) return;
    el.style.zIndex = '55';
    const a = el.animate([
      { translate: dx + 'px ' + dy + 'px', scale: String(sc), rotate: (spin ? (Math.random() * 40 - 20) : 0) + 'deg' },
      { translate: '0 0', scale: '1', rotate: '0deg' }
    ], { duration: dur || 460, delay: delay || 0, easing: 'cubic-bezier(.2,.9,.25,1.12)', fill: 'backwards' });
    a.onfinish = a.oncancel = function () { el.style.zIndex = ''; };
  }

  function cardName(c) {
    if (!c) return 'a card';
    if (E.isJoker(c)) return 'a Joker';
    return 'the ' + E.rankLabel(c.r) + ' of ' + ({ H: 'hearts', D: 'diamonds', S: 'spades', C: 'clubs' }[c.s] || '');
  }
  /* A card flies from a pile to a player's seat: slow enough to follow, face-up when it came from the discard pile. */
  function ghostFly(from, to, card, delay) {
    if (!document.body.animate || !from || !to || FX.reduced) return;
    const g = card ? cardEl(card, { oid: true }) : h('div', { class: 'back' });
    g.classList.add('ghostcard');
    g.style.left = from.left + 'px'; g.style.top = from.top + 'px';
    g.style.width = from.width + 'px'; g.style.height = from.height + 'px';
    document.body.append(g);
    const dx = (to.left + to.width / 2) - (from.left + from.width / 2);
    const dy = (to.top + to.height / 2) - (from.top + from.height / 2);
    const a = g.animate([
      { translate: '0 0', scale: '1', opacity: 0, offset: 0 },
      { translate: '0 0', scale: '1.25', opacity: 1, offset: 0.12 },
      { translate: (dx * 0.12) + 'px ' + (dy * 0.12) + 'px', scale: '1.3', opacity: 1, offset: 0.3 },
      { translate: dx + 'px ' + dy + 'px', scale: '0.6', opacity: 1, offset: 0.9 },
      { translate: dx + 'px ' + dy + 'px', scale: '0.5', opacity: 0, offset: 1 }
    ], { duration: 1100, delay: delay || 0, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'backwards' });
    a.onfinish = a.oncancel = function () { g.remove(); };
  }
  /* A short caption by the seat, like "Rita took the 7 of hearts". */
  function flyLabel(pid, text) {
    const r = chipRect(pid);
    if (!r || FX.reduced) return;
    const el = h('div', { class: 'flylabel' }, text);
    el.style.left = (r.left + r.width / 2) + 'px'; el.style.top = (r.top - 4) + 'px';
    document.body.append(el);
    setTimeout(function () { el.remove(); }, 2400);
  }
  function flights(before, ev, prev) {
    const app = document.getElementById('app');
    if (!app || !app.querySelectorAll) return;
    const stockR = rectOf(app.querySelector('.pile.stock .back, .pile.stock .empty'));
    const who = ev && (ev.buyerId || ev.actorId);
    let handN = 0;
    app.querySelectorAll('.card[data-id]').forEach(function (el) {
      const id = el.dataset.id, was = before.cards.get(id), zone = el.dataset.zone;
      if (was) { flyFrom(el, was, 0, false); return; }
      if (!ev) return;
      if (zone === 'hand') {
        if (ev.newRound) { flyFrom(el, stockR, 120 + handN * 70, true); handN++; }
        else if (ev.prevTop && ev.prevTop.id === id) flyFrom(el, before.disc, 0, true, 950);
        else { flyFrom(el, before.stock || stockR, ev.buyerId ? 700 : 0, true, 950); }
      } else if (!ev.newRound && who) {
        flyFrom(el, chipRect(ev.actorId || who), 0, true);
      } else if (ev.newRound && zone === 'discard') {
        flyFrom(el, stockR, 120, true);
      }
    });
    // Opponent draws: show a card zipping from the pile to their seat
    const me = V ? V.players[meIdx(V)] : null;
    if (ev && prev && !ev.newRound && who && me && who !== me.id) {
      const seat = chipRect(who);
      const nm = (V.players.find(function (p) { return p.id === who; }) || {}).name || 'Someone';
      if (ev.buyerId) { if (ev.prevTop) ghostFly(before.disc, seat, ev.prevTop, 0); ghostFly(before.stock, seat, null, 700); flyLabel(who, nm + ' BOUGHT ' + cardName(ev.prevTop)); }
      else if (ev.drewStock) { ghostFly(before.stock, seat, null, 0); flyLabel(who, nm + ' drew from the deck'); }
      else if (ev.tookDiscard && ev.prevTop) { ghostFly(before.cards.get(ev.prevTop.id) || before.disc, seat, ev.prevTop, 0); flyLabel(who, nm + ' took ' + cardName(ev.prevTop)); }
    }
  }

  /* Wheel at the very start of a game: spins and lands on the player the game already chose to go first. */
  function showSpinner(v) {
    const old = document.getElementById('spinner'); if (old) old.remove();
    const n = v.players.length, seg = 360 / n, target = v.turn;
    const colors = ['#e0556b', '#3f8fd9', '#e5a323', '#3fae6b', '#9a62d6', '#e07a3a', '#2fb5b0', '#c9578f'];
    const esc = function (t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
    const pt = function (r, deg) { const t = deg * Math.PI / 180; return [(150 + r * Math.sin(t)).toFixed(2), (150 - r * Math.cos(t)).toFixed(2)]; };
    let svg = '<svg viewBox="0 0 300 300" class="wsvg"><g class="wg" id="wheelg">';
    v.players.forEach(function (p, i) {
      const a0 = (i - 0.5) * seg, a1 = (i + 0.5) * seg, A = pt(140, a0), B = pt(140, a1);
      svg += '<path d="M150 150 L' + A[0] + ' ' + A[1] + ' A140 140 0 0 1 ' + B[0] + ' ' + B[1] + ' Z" fill="' + colors[i % colors.length] + '" stroke="#10131f" stroke-width="3"/>';
      const nm = p.id === v.youId ? 'YOU' : p.name;
      const label = nm.length > 8 ? nm.slice(0, 7) + '.' : nm;
      svg += '<text x="150" y="62" text-anchor="middle" font-size="' + (n > 6 ? 15 : 19) + '" fill="#fff" stroke="#0008" stroke-width="3" paint-order="stroke" transform="rotate(' + (i * seg).toFixed(2) + ' 150 150)">' + esc(label.toUpperCase()) + '</text>';
    });
    svg += '</g><circle cx="150" cy="150" r="20" fill="#10131f" stroke="#f3c34d" stroke-width="4"/></svg>';
    const wrap = h('div', { class: 'wheelwrap' });
    wrap.innerHTML = svg + '<div class="wptr"></div>';
    const title = h('div', { class: 'ft' }, 'WHO GOES FIRST?');
    const sub = h('div', { class: 'fx' }, 'spinning...');
    const el = h('div', { class: 'flash spinner', id: 'spinner' }, h('div', { class: 'flashbox' }, title, wrap, sub));
    document.body.append(el);
    const g = wrap.querySelector('#wheelg');
    const dur = 5200, jitter = (Math.random() - 0.5) * seg * 0.6;
    const rot = 360 * (5 + Math.floor(Math.random() * 3)) - target * seg + jitter;
    g.style.transition = 'transform ' + dur + 'ms cubic-bezier(.12,.62,.08,1)';
    g.getBoundingClientRect();
    requestAnimationFrame(function () { g.style.transform = 'rotate(' + rot + 'deg)'; });
    // tick sounds as segment borders pass the pointer (approximation of the easing curve)
    const t0 = performance.now(); let lastK = 0;
    (function ticks() {
      if (!document.body.contains(el)) return;
      const x = Math.min(1, (performance.now() - t0) / dur), prog = 1 - Math.pow(1 - x, 3.2);
      const k = Math.floor((prog * rot + seg / 2) / seg);
      if (k !== lastK) { lastK = k; Sound.select(k % 8); }
      if (x < 1) requestAnimationFrame(ticks);
    })();
    setTimeout(function () {
      if (!document.body.contains(el)) return;
      const w = v.players[target];
      title.textContent = (w.id === v.youId ? 'YOU GO' : w.name.toUpperCase() + ' GOES') + ' FIRST!';
      sub.textContent = ''; Sound.meld();
    }, dur + 100);
    setTimeout(function () { el.remove(); }, dur + 2200);
  }

  /* Drag cards in your hand to put them in your own order */
  function setupDrag() {
    let d = null;
    document.addEventListener('pointerdown', function (e) {
      if (building) return;
      const card = e.target.closest && e.target.closest('.hand .card');
      if (!card) return;
      const gr = groups.find(function (g) { return g.indexOf(card.dataset.id) >= 0; });
      const mem = Array.prototype.filter.call(document.querySelectorAll('.hand .card'), function (c) { return gr ? gr.indexOf(c.dataset.id) >= 0 : c === card; });
      d = { card: card, mem: mem, id: card.dataset.id, x: e.clientX, y: e.clientY, on: false, pid: e.pointerId };
    });
    document.addEventListener('pointermove', function (e) {
      if (!d || e.pointerId !== d.pid) return;
      const dx = e.clientX - d.x, dy = e.clientY - d.y;
      if (!d.on) { if (Math.hypot(dx, dy) < 10) return; d.on = true; d.mem.forEach(function (c) { c.classList.add('dragging'); }); }
      d.mem.forEach(function (c) { c.style.translate = dx + 'px ' + dy + 'px'; });
    });
    const end = function (e) {
      if (!d || e.pointerId !== d.pid) return;
      const was = d; d = null;
      if (!was.on) return;
      was.mem.forEach(function (c) { c.classList.remove('dragging'); c.style.translate = ''; });
      const others = Array.prototype.filter.call(document.querySelectorAll('.hand .card'), function (c) { return was.mem.indexOf(c) < 0; });
      let idx = 0;
      others.forEach(function (c) { const r = c.getBoundingClientRect(); if (e.clientX > r.left + r.width / 2) idx++; });
      const grp = groups.find(function (g) { return g.indexOf(was.id) >= 0; });
      let ids = others.map(function (c) { return c.dataset.id; });
      let block = [was.id];
      if (grp) {
        block = Array.from(document.querySelectorAll('.hand .card')).map(function (c) { return c.dataset.id; }).filter(function (id) { return grp.indexOf(id) >= 0; });
        const keep = ids.slice(0, idx).filter(function (id) { return grp.indexOf(id) < 0; }).length;
        ids = ids.filter(function (id) { return grp.indexOf(id) < 0; });
        idx = keep;
      }
      ids.splice.apply(ids, [idx, 0].concat(block));
      handOrder = ids; sortMode = 'custom';
      suppressClick = true; setTimeout(function () { suppressClick = false; }, 120);
      Sound.flip(); render();
    };
    document.addEventListener('pointerup', end);
    document.addEventListener('pointercancel', function (e) {
      if (d && d.on) d.mem.forEach(function (c) { c.classList.remove('dragging'); c.style.translate = ''; });
      d = null; void e;
    });
  }

  /* Card tilt + sheen that follows the mouse (desktop only) */

    document.body.insertAdjacentHTML('afterbegin', sprite);
    if (store('local', 'rummy.crt') === 'off') document.body.classList.add('nocrt');
    if (store('local', 'rummy.big') === 'on') applyBig(true);
    fitScreen(); window.addEventListener('resize', fitScreen);
    const cv = document.getElementById('bg');
    if (cv && FX.background) bg = FX.background(cv);
    document.addEventListener('pointerdown', function () { Sound.unlock(); });
    // soft tick when the mouse moves onto a button (mouse only, not touch)
    document.addEventListener('mouseover', function (e) {
      const b = e.target && e.target.closest ? e.target.closest('button') : null;
      if (!b || b.disabled || (b.contains && e.relatedTarget && b.contains(e.relatedTarget))) return;
      if (Sound.ctx !== undefined && Sound.on) Sound.hover();
    }, true);
    // typing sound in text boxes
    document.addEventListener('keydown', function (e) {
      const t = e.target;
      if (!t || !t.tagName || !/^(INPUT|TEXTAREA)$/.test(t.tagName) || e.ctrlKey || e.metaKey || e.key === 'Shift' || e.key === 'Control' || e.key === 'Alt' || e.key === 'Meta') return;
      Sound.unlock(); Sound.key();
    }, true);
    // soft click sound on every menu/game button
    document.addEventListener('click', function (e) {
      const b = e.target && e.target.closest ? e.target.closest('button') : null;
      if (b && !b.disabled) { Sound.unlock(); Sound.click(); }
    }, true);
    setupTilt(); setupDrag();
    render();
    try {
      const saved = JSON.parse(store('session', 'rummy.join') || 'null') || (location.hash ? null : lastRoom());
      if (saved && saved.code && !net) { net = new Client(saved.code, saved.name); }
    } catch (e) { /* ignore */ }
  });
  window.__rummy = { view: function () { return V; }, net: function () { return net; }, sel: function () { return selected; } };
})();


</script>
